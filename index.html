<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixar</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- nav     -->
    <header>
      <nav>
        <div class="nav">
          <div>
            <img class="nav_logo" src="assets/logo.webp" />
          </div>
          <div class="nav_items">
            <ul>
              <li>FILMS</li>
              <li>TECHNOLOGY</li>
              <li>CAREERS</li>
              <li>MORE</li>
            </ul>
            <i class="fa-solid fa-grip-lines"></i>
          </div>
        </div>
      </nav>
    </header>
    <section class="#">
      <div class="hero">
        <img class="hero_bg" src="assets/hero_bg.webp" />
        <img class="hero_img" src="assets/hero_img.webp" />
      </div>
      <!-- main 1 -->
      <div class="main_1">
        <div id="main_gatto">
          <img class="gatto_overlay" src="assets/gatto.webp" />
        </div>
        <div id="main_hop">
          <img class="hop_overlay" src="assets/hoppeers.webp" />
        </div>
      </div>
      <!-- main 2 -->
      <div class="main_2">
        <div id="main_ghost">
          <img class="ghost_overlay" src="assets/ghost-logo.webp" />
        </div>
        <div id="main_i3">
          <img class="ghost_overlay" src="assets/i3_logo.webp" />
        </div>
        <div id="main_coco">
          <img class="ghost_overlay" src="assets/coc2_v2.webp" />
        </div>
      </div>
      <!-- main 3 -->
      <div class="main_3">
        <div class="pic">
          <div class="pic_1"><img src="assets/pic1.webp" /></div>
          <div class="pic_2"><img src="assets/pic2.webp" /></div>
        </div>
        <div class="pic3">
          <div class="pic_conti">
            <h1>Careers at Pixar</h1>
            <p>
              At Pixar, we are proud of our tradition of creative and technical
              excellence and are always looking for talented people to enrich
              our work and our community. Learn more
            </p>
          </div>
        </div>
      </div>
      <!-- main 4 -->
      <div class="main_4">
        <div id="main_dory">
          <img class="dory_overlay" src="assets/loving.webp" />
        </div>
        <div id="main_win">
          <img class="win_overlay" src="assets/win.webp" />
          <img class="dis_overlay" src="assets/d+.webp" />
          <strong>N O W &nbsp; S T R E A M I N G</strong>
        </div>
        <div id="main_dream">
          <img class="dream_overlay" src="assets/dream.webp" />
          <img class="dis_overlay" src="assets/d+.webp" />
          <strong>N O W &nbsp; S T R E A M I N G</strong>
        </div>
      </div>
    </section>
  </body>
</html>
